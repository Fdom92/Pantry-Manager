<!doctype html>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:'Roboto','Helvetica Neue',Arial,sans-serif;color:#fff;
  background:linear-gradient(135deg,#17493f 0%,#2A7E70 55%,#4DB39D 100%)}
.glow{position:absolute;right:-120px;top:-60px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.26) 0%,rgba(255,255,255,0) 62%)}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:20px}
.brand img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.brand span{font-size:44px;font-weight:700;letter-spacing:-.5px}
h1{position:absolute;left:72px;top:200px;width:640px;font-size:64px;line-height:1.08;font-weight:900;letter-spacing:-1.5px;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.feat{position:absolute;left:72px;top:446px;width:620px;font-size:27px;line-height:1.35;opacity:.92}
.free{position:absolute;left:72px;bottom:52px;font-size:26px;font-weight:700;color:#d6f5ea}
.phone{position:absolute;right:92px;top:78px;width:322px;padding:11px;border-radius:64px 64px 0 0;
  background:linear-gradient(145deg,#2b3532,#0c100f 55%,#1d2523);
  box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.10) inset}
.screen{width:300px;border-radius:54px 54px 0 0;overflow:hidden;background:#fff}
.screen img{display:block;width:300px;height:auto}
</style>
<div class="glow"></div>
<div class="brand"><img src="{{ICON}}"><span>PantryMind</span></div>
<h1>{{HEADLINE}}</h1>
<div class="feat">{{FEATURES}}</div>
<div class="free">{{FREE}}</div>
<div class="phone"><div class="screen"><img src="{{IMG}}"></div></div>
