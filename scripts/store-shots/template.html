<!doctype html>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:'Roboto','Helvetica Neue',Arial,sans-serif;color:#fff;
  background:linear-gradient(160deg,#17493f 0%,#2A7E70 48%,#4DB39D 100%)}
.glow{position:absolute;left:50%;top:1010px;width:1100px;height:1100px;margin-left:-550px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 62%)}
.glow2{position:absolute;left:-250px;top:-250px;width:800px;height:800px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 65%)}
.copy{position:absolute;left:60px;right:60px;top:104px;text-align:center}
h1{font-size:80px;line-height:1.06;font-weight:900;letter-spacing:-1px;white-space:pre-line;text-shadow:0 2px 12px rgba(0,0,0,.18)}
p{margin-top:26px;font-size:44px;line-height:1.2;font-weight:400;opacity:.92}
/* Generic bezel: no brand, no fake system UI. The screenshot bleeds off the bottom edge. */
.phone{position:absolute;left:50%;top:486px;width:884px;margin-left:-442px;padding:17px;border-radius:112px 112px 0 0;
  background:linear-gradient(145deg,#2b3532,#0c100f 55%,#1d2523);
  box-shadow:0 40px 90px rgba(0,0,0,.42),0 0 0 2px rgba(255,255,255,.10) inset,0 0 0 3px rgba(0,0,0,.35)}
.screen{width:850px;border-radius:96px 96px 0 0;overflow:hidden;background:#fff}
.screen img{display:block;width:850px;height:auto}
</style>
<div class="glow2"></div><div class="glow"></div>
<div class="copy"><h1>{{HEADLINE}}</h1><p>{{SUB}}</p></div>
<div class="phone"><div class="screen"><img src="{{IMG}}"></div></div>
